# --------------------------------------------------------------------------
# Z-vector / Lagrangian embedding-gradient configuration (Stage 1)
# --------------------------------------------------------------------------
# Uses ewf.assembly = rdm_t_lambda: the same effective per-fragment
# amplitudes as the rdm_t route, but the global density is built from a
# proper CCSD Λ (Z-vector) solve instead of the l = t linearisation, so it
# carries the amplitude response of the global effective wavefunction.
# See README.md for the full Lagrangian theory and the staged roadmap.
#
# Recommended workflow:
#   1. Single-point gradient:
#        python EWF-CI_Geom_Opt_HPC.py --config config.yaml --single-point
#   2. Full optimisation (geomopt.enabled below):
#        python EWF-CI_Geom_Opt_HPC.py --config config.yaml
# --------------------------------------------------------------------------

ewf:
  # Stable, non-full bath (sits in a spectral gap so the cluster dimension
  # does not flicker between geometries).  Verify the per-fragment cluster
  # sizes are constant across a few geometries; widen if they change.
  bath_threshold: 1.0e-5

  # ``solver`` is used for every fragment ONLY when multi_solver.enabled is
  # false below.  In multi-solver mode it is ignored in favour of the
  # per-fragment, size-based selection.
  solver: SCI
  
  # This SCI cutoff is used for any fragments where SCI or SCI-SBD solver is assigned
  sci_select_cutoff: 1.0e-4

  # Per-fragment solver selection.  When enabled, the cluster solver is
  # chosen from the number of orbitals in each EWF cluster (nocc + nvir):
  #     norb <  norb_threshold  ->  high_accuracy_solver  (default FCI)
  #     norb >= norb_threshold  ->  approximate_solver    (default SCI)
  # i.e. small clusters are cheap enough for exact FCI, while large
  # clusters fall back to the approximate (truncated) solver.  SCI
  # clusters still use sci_select_cutoff.
  #
  # Each role (high_accuracy_solver / approximate_solver) and the single
  # ``solver`` above accept FCI, SCI, or SCI_SBD.  SCI_SBD is PySCF's SCI
  # subspace growth with the external Selected-Basis-Diagonalization (SBD)
  # binary as the per-cycle eigensolver; it requires the 'sbd:' block below
  # + Slurm + the compiled SBD binary.  (The name marks the SCI growth
  # scheme so future SBD workflows that grow the space differently stay
  # distinct.)  Example for large clusters on GPUs: approximate_solver: SCI_SBD.
  multi_solver:
    enabled: true
    norb_threshold: 13
    high_accuracy_solver: FCI
    approximate_solver: SCI_SBD

  # Stage-1 Lagrangian assembly: rdm_t amplitudes + CCSD Λ-relaxed density.
  #   rdm_t_lambda     -- amplitude-response (Z-vector) relaxed global density.
  #   rdm_t            -- l = t (TCCSD) linearised density (no Λ response).
  #   projected_lambda -- single-cluster RDM sum (Vayesta default 2-RDM);
  #                       energy/accuracy comparison point, not a gradient fix
  #                       (see Projected-lambda_README.md).
  #   ci               -- CI-coefficient route: global C1/C2 assembled
  #                       first (linear tiling, exact double-counting
  #                       avoidance), then one global CISD->CCSD conversion
  #                       (T2 = C2 - T1xT1 with the global T1).
  #   democratic       -- legacy four-index democratic projection.
  assembly: rdm_t_lambda

calculation:
  geometry_file: propylene.txt
  basis: sto-3g
  charge: 0
  spin: 0
  symmetry: false
  workdir: jobs
  fci_conv_tol: 1.0e-12

slurm:
  python_executable: python
  poll_interval: 15
  # DUMP wave (integral/cluster dump): one block, not solver-specific.
  dump:
    partition: xtreme
    ntasks: 2
    mem: 100G
  # Cluster-solve wave: PER-SOLVER resource blocks.  Each fragment's solve job
  # uses the block named after the solver that will actually run in it (FCI /
  # SCI / SCI_SBD).  FCI and SCI are light; the SCI_SBD block is the *outer*
  # orchestrator job that submits and waits on the nested SBD sub-jobs (sized
  # separately under sbd.slurm below) and needs enough RAM to drive them.
  FCI:
    partition: xtreme
    ntasks: 2
    mem: 10G
  SCI:
    partition: xtreme
    ntasks: 2
    mem: 10G
  SCI_SBD:
    partition: xtreme
    ntasks: 2
    mem: 100G

# ---------------------------------------------------------------------------
# SBD eigensolver configuration (only used when a cluster solver is 'SCI_SBD').
# ---------------------------------------------------------------------------
# When a fragment is assigned the SCI_SBD solver, the per-fragment solve worker
# keeps PySCF's Selected-CI determinant growth but delegates each cycle's
# diagonalization to the external SBD binary, submitting ONE Slurm job per
# growth cycle (resources from sbd.slurm below) and blocking until it
# finishes.  This nests inside the per-fragment 'solve' job, whose own
# resources come from the slurm.SCI_SBD block above -- that outer job only
# orchestrates/waits (hence few tasks) but needs enough RAM to drive the
# sub-jobs; the heavy compute is sized separately via sbd.slurm below.  See
# SBD-in-PySCF-SCI-Exploration/README.md for full details.
sbd:
  sbd_exe_path_cpu: '/mnt/beegfs/merzk/kaliakd/Software/SBD_Solver/executable/diag'
  sbd_exe_path_gpu: '/home/liz7/isilon/Zhen/sbd-main/apps/chemistry_tpb_selected_basis_diagonalization/diag'
  # proc_type + gpus_per_batch / cpus_per_batch are the SINGLE source of truth
  # for SBD's parallel layout: they set BOTH the SBD `mpirun -np` and the Slurm
  # allocation (--ntasks / --gres / --cpus-per-task) for the sub-job below, so
  # the two can never disagree.  Do NOT also set ntasks/gres under sbatch.
  proc_type: 1            # 1 = GPU (CPUs as support), 0 = CPU-only
  gpus_per_batch: 4       # GPU runs: -np = gpus_per_batch*16, --gres=gpu:<n>, --ntasks=<n*16>
  cpus_per_batch: 1       # CPU runs: -np = cpus_per_batch, --ntasks=cpus_per_batch (ignored for GPU)
  sbd_omp_threads: 1      # CPU runs: OMP threads/rank -> --cpus-per-task (ignored for GPU)
  # SCI needs each diagonalization well converged (PySCF selects the next
  # determinants from the returned CI vector), so these are tighter than SQD.
  sbd_block: 20
  sbd_dav_iteration: 100
  sbd_tolerance: 1.e-8    # keep this exact "1.e-8" notation
  sbd_adet_comm_size: 2   # "comm_size" options ignored in GPU run
  sbd_bdet_comm_size: 2
  sbd_task_comm_size: 2
  sbd_init: 0
  sbd_shuffle: 0
  sbd_carryover_ratio: 0.5
  # Slurm resources for each per-cycle SBD diagonalization job.  NOTE:
  # --ntasks, --gres and --cpus-per-task are DERIVED from proc_type +
  # gpus_per_batch / cpus_per_batch above (single source of truth) and are
  # injected automatically; do not set them here (they would be overridden).
  # Set only the placement/limits not tied to the rank count.
  slurm:
    poll_interval: 15
    sbatch:
      partition: 'merzk-a100'
      nodes: 1
      mem: 500G

geomopt:
  enabled: true
  prefix: ewf_geomopt
  step_subdir_fmt: "step_{step:03d}"
  geometric:
    maxiter: 100
    coordsys: tric
    # With Stage-1 (amplitude-response only) the gradient floor is reduced
    # but the bath/projector geometric response is still omitted, so keep a
    # realistic gradient threshold until Stages 2-3 land.
    convergence_energy: 1.0e-3   # Eh
    convergence_grms:   5.0e-3   # Eh / Bohr
    convergence_gmax:   5.0e-3   # Eh / Bohr
    convergence_drms:   1.2e-2   # Angstrom
    convergence_dmax:   1.8e-2   # Angstrom