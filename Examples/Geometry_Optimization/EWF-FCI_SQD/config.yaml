# ===========================================================================
# config.yaml generated by calculation_setup.py
#   HPC settings       : CCF
#   run_task           : geomopt
#   run_mode           : ewf
#   HF acceleration    : gpu=no, density_fit=no
#   multi-solver       : yes
#   external eigsolver : SQD (GPU)
#
# FOCUSED template -- only the options relevant to this run type are shown;
# everything else uses the driver defaults.  Review and UPDATE every line
# marked '<-- UPDATE' (geometry, basis, paths, account/partition, resources)
# before submitting.
# ===========================================================================

ewf:
  bath_threshold: 1.0e-5      # bath truncation threshold
  solver: SCI             # single-solver value (ignored when multi_solver.enabled is true)
  multi_solver:
    enabled: true
    norb_threshold: 13        # clusters with norb < this -> high_accuracy_solver
    high_accuracy_solver: FCI
    approximate_solver: SQD
  assembly: rdm_t_lambda      # density-assembly route (rdm_t_lambda / rdm_t / ci / projected_lambda / democratic)

calculation:
  run_task: geomopt         # geomopt | gradient (single-point E+grad) | energy (E only) | circuits (LUCJ circuit-size analysis, no solve)
  run_mode: ewf
  geometry_file: acetone.txt       # geometry file (Element x y z, one atom per line)
  basis: sto-3g                  # <-- UPDATE: basis set
  charge: 0                      # <-- UPDATE if non-neutral
  spin: 0                        # closed-shell required (esp. true_unfragmented)
  symmetry: false
  workdir: jobs
  fci_conv_tol: 1.0e-12
  # Workflow-level restart: when true (or when the driver is invoked with
  # --restart) the driver scans the workdir and reuses every artefact that
  # is already complete -- step_<NNN>/result.json (cached E + gradient),
  # step_<NNN>/hf.chk (cached converged RHF), per-fragment cluster_<i>.h5
  # / rdm_<i>.h5, and completed SCI_SBD / SQD sub-jobs (iter_*/[batch_*/]
  # sbd_job.status == DONE, plus any existing sqd_scratch_*/count_dict.txt).
  # Default off: wipe stale files and rerun.
  restart: false                 # true | false  (or use --restart on CLI)

# Hartree-Fock acceleration (both optional; both default off = classic
# CPU, 4-index-ERI SCF).  gpu: run the initial SCF on GPU via gpu4pyscf
# (needs gpu4pyscf on the compute node).  density_fit: build
# RHF(mol).density_fit(); the density-fitted mean field propagates into
# Vayesta's MP2 bath automatically (CDERI-based BNO bath).  Independent
# of these, every driver SCF also caches the converged AO integrals as
# .npy next to hf.chk (hf_npy/) to accelerate restart on large systems.
hf:
  gpu: false               # run the initial SCF on GPU (gpu4pyscf)
  density_fit: false       # RHF(mol).density_fit(); DF flows into the Vayesta MP2 bath

# Slurm resources for the fragmented DUMP + solve waves.
slurm:
  python_executable: python
  poll_interval: 15
  # Throttle for the SOLVE wave: max per-fragment solve jobs kept in
  # flight at once.  0 = unlimited (submit all -- historical default).
  # For large systems (many fragments) whose solve jobs spawn nested
  # SBD sub-jobs (SCI_SBD / SQD), set a finite cap (e.g. 16-32) so the
  # parent jobs do not exhaust the per-user Slurm job / GPU budget and
  # starve their own SBD children (which otherwise sit queued forever).
  max_concurrent_solve: 0
  dump:                        # integral / cluster dump wave
    partition: defq
    ntasks: 2
    mem: 100G
  # Per-solver solve-wave blocks (one job per fragment uses the block named
  # after the solver that runs in it).  FCI / plain SCI are light; the
  # SCI_SBD / SQD orchestrator jobs use the 'parent' partition/time.
  FCI:
    partition: defq
    ntasks: 2
    mem: 10G
  SQD:
    partition: defq
    ntasks: 2
    mem: 170G

# Sample-based Quantum Diagonalization (SQD) -- present because a solver
# is SQD.  Each SQD iteration submits 'n_batches' parallel SBD Slurm jobs
# (the SBD binary is the same one used by SCI_SBD); a final ext-SQD Slurm
# job augments the recovered subspace with PyCI single excitations and
# runs SBD with --rdm 1 to produce the per-fragment 1- and 2-RDMs.
sqd:
  sbd_exe_path_cpu: '/mnt/beegfs/merzk/kaliakd/Software/SBD_Solver/executable/diag'
  sbd_exe_path_gpu: '/home/liz7/isilon/Zhen/sbd-main/apps/test/diag'
  mpi_launcher: '/home/liz7/isilon/Zhen/mpich/bin/mpirun'   # absolute path (PATH-independent)
  proc_type: 1            # 1 = GPU (CPUs as support)
  gpus_per_batch: 1       # GPUs per SBD batch -> --gpus-per-node
  cpus_per_gpu: 8       # support MPI ranks PER GPU (>=8; ranks = gpus*cpus_per_gpu)
  sbd_omp_threads: 1      # OMP threads/rank (keep gpus*cpus_per_gpu*omp <= cores/node)
  sbd_advanced_memory: false   # EXPERIMENTAL when true: GPU RAM/VRAM guardrails (det-cache caps, comm-size split, tuned block). false = stable defaults (commit 0000c598)
  sbd_block: 8
  sbd_dav_iteration: 10   # SQD: relaxed vs SCI_SBD's 100 (per-batch SBD is much more expensive)
  sbd_tolerance: 1.e-5    # SQD: relaxed vs SCI_SBD's 1.e-8; keep this exact '1.e-5' notation
  sbd_init: 0
  sbd_shuffle: 0
  sbd_carryover_ratio: 0.5
  # --- SQD recovery loop --------------------------------------------
  iterations: 5            # number of SQD configuration-recovery cycles
  n_batches: 4             # parallel SBD batches submitted per iteration
  samples_per_batch: 2000   # bitstrings sampled per batch
  energy_tol: 1.0e-8       # energy convergence between SQD iterations
  occupancies_tol: 1.0e-5  # orbital-occupancy convergence between iterations
  carryover_threshold: 1.0e-4  # |c| above which a determinant survives to the next iteration
  symmetrize_spin: true    # symmetrise alpha/beta when n_alpha == n_beta
  add_hf_string: true      # always include the Hartree-Fock determinant in each batch
  ext_sqd_dprime_cutoff: 1.0e-5  # |c| cutoff for the ext-SQD PyCI determinant set
  # Disk-storage optimisation for the per-iteration SBD scratch.  Each
  # iteration always writes a durable iter_<NNN>/iteration_summary.json
  # (per-batch energies, lowest-energy batch, its occupancies) that
  # restart and analysis read.  none = keep every file; safe = also
  # delete regenerated det inputs + SBD dead-weight files never read
  # back; aggressive = safe + keep only the lowest-energy batch's
  # matrixformwf.txt per iteration.  slurm.out/err and
  # sbd_solver_logfile.log are always kept.
  prune_scratch: aggressive   # none | safe | aggressive
  # NOTE: restart across SQD iterations is driven by the workflow-level
  # calculation.restart flag (or --restart on the CLI); per-solver
  # restart knobs are intentionally not exposed here.  See the header of
  # calculation.restart in the 'calculation:' block above.
  # seed: 42                # RNG seed for sub-sampling reproducibility
  # max_dim: 200000         # cap on selected determinants per spin sector
  # --- quantum-sampling source --------------------------------------
  # EITHER run ffsim + Qiskit SamplerV2 on an IBM backend each time
  # (sample_on_the_fly: true, the default -- requires qiskit-ibm-runtime,
  # ffsim, and an IBM Quantum account in the compute-node environment),
  # OR point to a pre-collected count_dict.txt (single path or a per-
  # fragment mapping) and set sample_on_the_fly: false.
  sample_on_the_fly: true
  # count_dict_path: /path/to/count_dict.txt
  # per_fragment_samples:
  #   0: /path/to/cluster_0_count_dict.txt
  #   1: /path/to/cluster_1_count_dict.txt
  qiskit_backend: ibm_cleveland   # IBM backend name for SamplerV2
  default_shots: 100000           # shots per Qiskit SamplerV2 job
  n_reps: 1                       # LUCJ ansatz repetitions
  maximum_alpha_beta_connections: 4   # max LUCJ alpha-beta interaction pairs (placed on orbitals 0,4,8,...); caps the alpha-beta coupling qubits
  thresh_two_q: 1.0               # ffsim two-qubit-gate threshold
  thresh_meas: 0.10               # ffsim measurement threshold
  # Slurm for each SBD sub-job (one per SQD batch + one for ext-SQD).
  # --ntasks/--gpus-per-node/--cpus-per-task are auto-derived from the
  # knobs above; set only placement / mem / time (and optional extra.exclude).
  slurm:
    poll_interval: 15
    max_node_retries: 5       # resubmit on another node if mpirun is missing
    preamble: |               # <-- UPDATE if your environment changes
      module load gcc/11.2.0 cuda12.3/toolkit/12.3.2 cudnn8.9-cuda12.3/8.9.7.29 boost/1.85.0
      export PATH="/home/liz7/isilon/Zhen/mpich/bin:$PATH"
      export LD_LIBRARY_PATH="/home/liz7/beegfs/liz7/openblasgpu/lib:$LD_LIBRARY_PATH"
      export PATH="/home/liz7/beegfs/liz7/openblasgpu/bin:$PATH"
    sbatch:
      partition: merzk-a100
      mem: 500G
      extra:
        exclude: m002   # skip nodes that fail mpirun

geomopt:
  enabled: true                  # driven by calculation.run_task (true only for run_task: geomopt)
  optimizer: sella            # geometric | berny | sella
  prefix: ewf_geomopt
  step_subdir_fmt: "step_{step:03d}"
  sella:
    fmax:  0.1           # eV / Angstrom (max-force convergence)
    steps: 25            # max optimizer steps
    order: 0            # 0 = minimisation (default), 1 = saddle
    internal: true      # use internal coordinates
