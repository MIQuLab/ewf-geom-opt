# ===========================================================================
# config.yaml generated by calculation_setup.py
#   HPC type           : MSU
#   run_mode           : ewf
#   multi-solver       : yes
#   SCI-SBD            : yes (GPU)
#
# FOCUSED template -- only the options relevant to this run type are shown;
# everything else uses the driver defaults.  Review and UPDATE every line
# marked '<-- UPDATE' (geometry, basis, paths, account/partition, resources)
# before submitting.
# ===========================================================================

ewf:
  bath_threshold: 1.0e-5      # DMET bath truncation threshold
  solver: SCI             # single-solver value (ignored when multi_solver.enabled is true)
  sci_select_cutoff: 1.0e-4   # SCI / SCI_SBD determinant-selection cutoff
  multi_solver:
    enabled: true
    norb_threshold: 13        # clusters with norb < this -> high_accuracy_solver
    high_accuracy_solver: FCI
    approximate_solver: SCI_SBD
  assembly: rdm_t_lambda      # density-assembly route (rdm_t_lambda / rdm_t / ci / projected_lambda / democratic)

calculation:
  run_mode: ewf
  geometry_file: propylene.txt     # geometry file (Element x y z, one atom per line)
  basis: sto-3g                  # <-- UPDATE: basis set
  charge: 0                      # <-- UPDATE if non-neutral
  spin: 0                        # closed-shell required (esp. true_unfragmented)
  symmetry: false
  workdir: jobs
  fci_conv_tol: 1.0e-12

# Slurm resources for the fragmented DUMP + solve waves.
slurm:
  python_executable: /mnt/home/k0095864/.conda/envs/ewf/bin/python3.1   # explicit interpreter (MSU compute nodes lack an active conda env)
  poll_interval: 15
  preamble: |                # env setup inside each DUMP/solve sub-job
      export PATH="/mnt/home/k0095864/.conda/envs/ewf/bin:$PATH"
  dump:                        # integral / cluster dump wave
    account: merzjrke      # <-- UPDATE if needed
    ntasks: 2
    mem: 100G
    time: '12:00:00'
  # Per-solver solve-wave blocks (one job per fragment uses the block named
  # after the solver that runs in it).
  FCI:
    account: merzjrke      # <-- UPDATE if needed
    ntasks: 2
    mem: 10G
    time: '12:00:00'
  SCI_SBD:
    account: merzjrke      # <-- UPDATE if needed
    ntasks: 2
    mem: 100G
    time: '12:00:00'

# External SBD eigensolver (present because a solver is SCI_SBD).
sbd:
  sbd_exe_path_cpu: '/mnt/home/lizhen6/SBD_Solver/executable/diag'
  sbd_exe_path_gpu: '/mnt/home/lizhen6/sbd/apps/chemistry_tpb_selected_basis_diagonalization/diag'
  mpi_launcher: '/mnt/home/lizhen6/mpich/bin/mpirun'   # absolute path (PATH-independent)
  proc_type: 1            # 1 = GPU (CPUs as support)
  gpus_per_batch: 4       # GPUs per SBD job -> --gpus-per-node
  cpus_per_gpu: 16      # support MPI ranks PER GPU (>=8; ranks = gpus*cpus_per_gpu)
  gpu_type: a100     # MSU GPU model -> --gpus-per-node=a100:<n>
  sbd_omp_threads: 1      # OMP threads/rank (keep gpus*cpus_per_gpu*omp <= cores/node)
  sbd_block: 20
  sbd_dav_iteration: 100
  sbd_tolerance: 1.e-8    # keep this exact '1.e-8' notation
  sbd_init: 0
  sbd_shuffle: 0
  sbd_carryover_ratio: 0.5
  # Slurm for each per-cycle SBD sub-job.  --ntasks/--gpus-per-node/
  # --cpus-per-task are auto-derived from the knobs above; set only
  # placement / mem / time (and optional extra.exclude).
  slurm:
    poll_interval: 15
    max_node_retries: 5       # resubmit on another node if mpirun is missing
    preamble: |               # <-- UPDATE if your environment changes
      module purge
      module load powertools GCCcore/13.3.0 LLVM/18.1.8-GCCcore-13.3.0 OpenBLAS/0.3.27-GCC-13.3.0 CUDA/12.9.1
      export PATH="/mnt/home/lizhen6/mpich/bin:$PATH"
    sbatch:
      account: merzjrke      # <-- UPDATE if needed
      mem: 350G
      time: '12:00:00'
      # extra:
      #   exclude: node01,node02   # skip nodes that fail mpirun

geomopt:
  enabled: true                  # set false for a single-point energy + gradient
  prefix: ewf_geomopt
  step_subdir_fmt: "step_{step:03d}"
  geometric:
    maxiter: 100
    coordsys: tric
    convergence_energy: 1.0e-3   # Eh
    convergence_grms:   5.0e-3   # Eh / Bohr
    convergence_gmax:   5.0e-3   # Eh / Bohr
    convergence_drms:   1.2e-2   # Angstrom
    convergence_dmax:   1.8e-2   # Angstrom
